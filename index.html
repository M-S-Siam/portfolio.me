    <script>
      // Defensive handling for browser extensions attempting to monkey-patch window.fetch
      (function() {
        try {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Suppress unhandled errors injected by third-party browser extensions
        window.addEventListener('error', function(event) {
          if (event && (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('chrome-extension://') !== -1) ||
            (event.error && event.error.stack && event.error.stack.indexOf('chrome-extension://') !== -1)
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            (event.reason.stack && event.reason.stack.indexOf('chrome-extension://') !== -1) ||
            (event.reason.message && event.reason.message.indexOf('chrome-extension://') !== -1)
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
